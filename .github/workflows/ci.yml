name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  discovery:
    name: Discovery tools and citations
    runs-on: ubuntu-latest
    env:
      CARDDEMO_REF: ${{ github.workspace }}/reference/carddemo
    steps:
      - uses: actions/checkout@v7

      - name: Check out the CardDemo reference at the pinned commit
        uses: actions/checkout@v7
        with:
          repository: aws-samples/aws-mainframe-modernization-carddemo
          ref: 59cc6c2fd7ebd7ef7925cad552a01a4b8b6e4d5e
          path: reference/carddemo
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6

      - name: Test check_citations
        working-directory: tools/check_citations
        run: uv run --locked --dev pytest -q

      - name: Test inventory
        working-directory: tools/inventory
        run: uv run --locked --dev pytest -q

      - name: Test diff_analyses
        working-directory: tools/diff_analyses
        run: uv run --locked --dev pytest -q

      - name: Check the inventory is up to date
        run: |
          uv run --locked --project tools/inventory tools/inventory/inventory.py --clone "$CARDDEMO_REF"
          if ! git diff --exit-code -- docs/current-state/ || [ -n "$(git ls-files --others --exclude-standard -- docs/current-state/)" ]; then
            echo "::error::Generated inventory files in docs/current-state are out of date. Run tools/inventory and commit the result."
            exit 1
          fi

      - name: Check rule citations
        run: |
          shopt -s nullglob
          dirs=(docs/current-state/rules docs/current-state/analysis-*/rules)
          checked=0
          for dir in "${dirs[@]}"; do
            [ -d "$dir" ] || continue
            uv run --locked --project tools/check_citations tools/check_citations/check_citations.py "$dir" "$CARDDEMO_REF"
            checked=$((checked + 1))
          done
          [ "$checked" -gt 0 ] || echo "No rule folders yet; nothing to check."

  locked-paths:
    name: Implementer PRs leave tests and specs alone
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed paths
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "Changed files:"
          echo "$changed"
          locked=$(echo "$changed" | grep -E '^(tests/|docs/specs/)' || true)
          if [ -n "$locked" ]; then
            echo "::error::Implementer pull requests must not change tests/ or docs/specs/:"
            echo "$locked"
            exit 1
          fi
